[package]
name = "guarita"
version = "0.1.0"
description = "Guarita no PC: companheiro em PT-BR para quem joga Albion Online (Americas)"
authors = ["Guarita"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "guarita_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-http = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
