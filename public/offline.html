<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16130f" />
    <meta name="robots" content="noindex" />
    <title>Sem conexão · Guarita</title>
    <style>
      :root {
        --bg: #f5f2ec; --surface: #fffdf9; --ink: #221e18; --muted: #645d52; --line: #e2dacb;
        --accent: #8a5810; --accent-ink: #fffdf9;
        --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #14120f; --surface: #1d1a16; --ink: #ede6d9; --muted: #a59c8d; --line: #343028; --accent: #e3a84c; --accent-ink: #14120f; }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font);
        display: grid; place-items: center; padding: 24px 16px;
      }
      main { max-width: 26rem; width: 100%; text-align: center; }
      svg { width: 72px; height: 72px; display: block; margin: 0 auto 16px; }
      h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 8px; }
      p { margin: 0 0 16px; color: var(--muted); }
      button {
        font: inherit; font-weight: 600; min-height: 44px; padding: 10px 20px; border-radius: 10px; cursor: pointer;
        background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent);
      }
      button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
      .small { font-size: 0.875rem; margin-top: 20px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect width="64" height="64" rx="14" fill="#16130f"/><path d="M32 10 14 20v6h36v-6zM18 28v20h6V36h16v12h6V28zM10 50h44v6H10z" fill="#e0a64b"/></svg>
      <h1>Sem conexão com a internet</h1>
      <p>A Guarita mostra preços e horários ao vivo, então precisa de internet para abrir esta página. Confira a conexão e tente de novo.</p>
      <button type="button" id="retry">Tentar de novo</button>
      <p class="small">Os alertas que você já ativou continuam ativos; nada muda neles enquanto o aparelho está sem conexão.</p>
    </main>
    <script>
      // O service worker devolve esta página também para /es/...: a língua vem do caminho, como no site.
      if (/^\/es(\/|$)/.test(location.pathname)) {
        document.documentElement.lang = 'es';
        document.title = 'Sin conexión · Guarita';
        document.querySelector('h1').textContent = 'Sin conexión a internet';
        var ps = document.querySelectorAll('main p');
        ps[0].textContent = 'La Guarita muestra precios y horarios en vivo, así que necesita internet para abrir esta página. Revisa la conexión e inténtalo de nuevo.';
        ps[1].textContent = 'Las alertas que ya activaste siguen activas; nada cambia en ellas mientras el dispositivo está sin conexión.';
        document.getElementById('retry').textContent = 'Intentar de nuevo';
      }
      document.getElementById('retry').addEventListener('click', function () { location.reload(); });
      // Volta sozinho quando a conexão retorna.
      window.addEventListener('online', function () { location.reload(); });
    </script>
  </body>
</html>
